<style>
        .neo-shadow {
            box-shadow: 4px 4px 0px 0px rgba(27,28,28,1);
        }
        .neo-shadow-hover:hover {
            box-shadow: 2px 2px 0px 0px rgba(27,28,28,1);
            transform: translate(2px, 2px);
        }
        .neo-border {
            border: 2px solid #1b1c1c;
        }
        
        /* Playful Shapes */
        .shape-star {
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }
        .shape-triangle {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        /* Hover Jiggle Animation */
        .hover-jiggle {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .group:nth-child(odd) .hover-jiggle:hover {
            transform: scale(1.05) rotate(-3deg);
        }
        .group:nth-child(even) .hover-jiggle:hover {
            transform: scale(1.05) rotate(3deg);
        }

        link.remove();

    document.getElementById('download-resume').addEventListener('click', () => {
        window.parent.postMessage({ type: 'download-resume' }, '*');
    });

    let toastTimeout;
    function handleContactClick(button, defaultText, copyText) {
        // Determine what text to copy
        const textToCopy = copyText;
        
        navigator.clipboard.writeText(textToCopy).then(() => {
            // Fade out current text
            button.style.opacity = '0';
            
            setTimeout(() => {
                // Toggle text content
                button.innerText = button.innerText === defaultText ? copyText : defaultText;
                // Fade back in
                button.style.opacity = '1';
            }, 200);

            // Show toast notification
            const toast = document.getElementById('copy-toast');
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            
            // Clear existing timeout to reset fade out if clicked rapidly
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }).catch(err => {
            console.error('Failed to copy: ', err);
        });
    }
</script>
